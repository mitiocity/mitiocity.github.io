<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta
    name="description"
    content="数字をつないで合計8を作るパズルゲーム、とーたるえいと❣️"
  >
  <title>とーたるえいと❣️</title>

  <script>
    /*
      古いキャッシュ型Service Workerを、
      今回の「常に最新版を読む」Service Workerへ即時更新する。

      最初の1回だけ自動再読み込みされる場合がある。
      ユーザーがSafariやChromeの履歴・Webサイトデータを
      削除する必要はない。
    */
    (() => {
      if (!("serviceWorker" in navigator)) {
        return;
      }

      const reloadKey = "total-eight-network-only-worker-installed";

      navigator.serviceWorker
        .register("/service-worker.js?rev=network-only-20261118-v1", {
          scope: "/"
        })
        .then((registration) => {
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (sessionStorage.getItem(reloadKey) === "done") {
              return;
            }

            sessionStorage.setItem(reloadKey, "done");
            window.location.reload();
          });

          return registration.update();
        })
        .catch(() => {
          /*
            Service Workerが使えない環境でも、
            通常のブラウザページとしてゲームを動かす。
          */
        });
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app-shell">

    <section id="title-screen" class="screen is-active">
      <div class="title-content">
        <p class="eyebrow">CONNECT · CALCULATE · CLEAR</p>
        <h1>とーたるえいと<span>❣️</span></h1>
        <p class="lead">すべてを、8にしろ。</p>

        <div class="title-menu">
          <button id="start-button" class="main-button main-button--primary" type="button">
            <strong>START</strong>
            <small>ゲームを始める</small>
          </button>

          <button id="tutorial-button" class="main-button" type="button">
            <strong>TUTORIAL</strong>
            <small>遊び方を確認する</small>
          </button>

          <button id="ranking-button" class="main-button" type="button">
            <strong>LOCAL RANKING</strong>
            <small>この端末のランキング</small>
          </button>
        </div>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <header class="game-header">
        <div class="hud-box">
          <span>SCORE</span>
          <strong id="score-value">0</strong>
        </div>

        <div class="hud-box">
          <span>LEVEL</span>
          <strong id="level-value">1</strong>
        </div>

        <div class="hud-box hud-box--over">
          <span>OVER</span>
          <div id="over-gauge" class="over-gauge" aria-label="オーバーゲージ">
            <i></i><i></i><i></i>
          </div>
        </div>
      </header>

      <div class="game-status">
        <strong id="combo-label">READY</strong>
        <strong id="fever-label" class="is-hidden">FEVER!</strong>
      </div>

      <div id="game-board" class="game-board" aria-label="ゲーム盤面"></div>

      <section class="next-area" aria-label="次のリング">
        <span>NEXT RING</span>
        <div id="next-ring" class="next-ring">
          <b id="next-ring-number">1</b>
        </div>
        <p>オーブか空白レーンをタップ</p>
      </section>

      <button id="game-menu-button" class="corner-button" type="button">MENU</button>
    </section>

    <section id="tutorial-screen" class="screen">
      <header class="simple-header">
        <button id="tutorial-exit-button" class="corner-button" type="button">終了</button>
        <h2>TUTORIAL</h2>
      </header>

      <div id="tutorial-board" class="tutorial-board"></div>

      <section class="tutorial-message">
        <strong id="tutorial-step-label">STEP 1 / 6</strong>
        <p id="tutorial-text"></p>
      </section>

      <button id="tutorial-next-button" class="main-button main-button--primary tutorial-next" type="button">
        <strong>次へ</strong>
      </button>
    </section>

    <section id="ranking-screen" class="screen">
      <header class="simple-header">
        <button class="corner-button return-title-button" type="button">戻る</button>
        <h2>LOCAL RANKING</h2>
      </header>

      <ol id="ranking-list" class="ranking-list"></ol>
      <p class="ranking-note">この端末内に保存されるランキングです。</p>
    </section>

    <section id="game-over-modal" class="modal" aria-hidden="true">
      <div class="modal-card">
        <p class="eyebrow">GAME OVER</p>
        <h2>オーブ領域が限界です</h2>
        <p>FINAL SCORE</p>
        <strong id="final-score-value" class="final-score">0</strong>

        <button id="retry-button" class="main-button main-button--primary" type="button">
          <strong>RETRY</strong>
        </button>

        <button id="return-title-button" class="main-button" type="button">
          <strong>TITLE</strong>
        </button>
      </div>
    </section>

    <section id="tutorial-complete-modal" class="modal" aria-hidden="true">
      <div class="modal-card">
        <p class="eyebrow">TUTORIAL COMPLETE</p>
        <h2>準備完了。</h2>
        <p>すべてを、8にしろ。</p>

        <button id="tutorial-start-game-button" class="main-button main-button--primary" type="button">
          <strong>START</strong>
        </button>

        <button id="tutorial-restart-button" class="main-button" type="button">
          <strong>もう一度</strong>
        </button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
