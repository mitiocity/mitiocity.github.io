<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >
  <title>とーたるえいと❣️</title>
  <link rel="stylesheet" href="style.css?v=20261118-10">

  <style>
    #title-screen h1,
    #title-screen h1 span {
      color: #fff3bd;
      -webkit-text-stroke: 1px rgba(6, 12, 34, 0.88);
      text-shadow:
        0 2px 0 rgba(5, 10, 28, 0.96),
        0 0 10px rgba(255, 229, 140, 0.95),
        0 0 28px rgba(255, 200, 73, 0.62),
        0 0 55px rgba(91, 131, 255, 0.3);
    }

    .portal-return-button {
      display: flex;
      width: 100%;
      min-height: 56px;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 14px 18px;
      color: #fff6d2;
      border: 1px solid rgba(255, 224, 117, 0.72);
      border-radius: 15px;
      background:
        linear-gradient(
          135deg,
          rgba(85, 61, 22, 0.92),
          rgba(25, 30, 60, 0.94)
        );
      box-shadow:
        0 0 18px rgba(255, 224, 117, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      font-weight: 900;
      letter-spacing: 0.05em;
      text-decoration: none;
    }

    .portal-return-button::after {
      content: "←";
      color: #ffe075;
      font-size: 1.25rem;
      line-height: 1;
    }

    .portal-return-button:active {
      transform: scale(0.97);
    }

    .portal-return-button:focus-visible {
      outline: 2px solid #ffe075;
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main class="app">

    <div class="stage-lights" aria-hidden="true">
      <i class="stage-light stage-light--left"></i>
      <i class="stage-light stage-light--right"></i>
      <i class="stage-light stage-light--center"></i>
      <i class="stage-laser stage-laser--left"></i>
      <i class="stage-laser stage-laser--right"></i>
      <div class="stage-particles"></div>
    </div>

    <section id="title-screen" class="screen is-active">
      <div class="title-content">
        <p class="eyebrow">CONNECT · CALCULATE · CLEAR</p>

        <h1>とーたるえいと<span>❣️</span></h1>

        <p class="lead">合計8にして高スコアを狙え</p>

        <div class="title-menu">
          <button
            id="start-button"
            class="menu-button primary"
            type="button"
          >
            <strong>スタート</strong>
            <small>START</small>
          </button>

          <button
            id="tutorial-button"
            class="menu-button"
            type="button"
          >
            <strong>チュートリアル</strong>
            <small>TUTORIAL</small>
          </button>

          <a
            class="portal-return-button"
            href="../#home"
            aria-label="みちを市ポータルサイトへ戻る"
          >
            みちを市ポータルサイトへ戻る
          </a>
        </div>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <header class="hud">

        <div class="hud-score">
          <span>経験値</span>
          <strong id="score-value">0</strong>
        </div>

        <div class="hud-level">
          <span>レベル</span>
          <strong id="level-value">1</strong>
        </div>

        <div class="hud-stage">
          <span>ステージ経験値</span>
          <strong>
            <b id="stage-score-value">0</b>
            <em>/</em>
            <b id="stage-target-value">4500</b>
          </strong>
        </div>

        <div class="hud-time">
          <span>残り時間</span>
          <strong id="time-value">300</strong>
        </div>

        <div class="hud-over">
          <span>オーバー</span>

          <p id="over-gauge">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
          </p>
        </div>
      </header>

      <strong id="status-label" class="status">READY</strong>

      <div class="play-area">
        <div
          id="game-board"
          class="board"
          aria-label="ゲーム盤面"
        ></div>

        <aside class="queue" aria-label="控えリング">
          <b>控え</b>

          <div id="ring-queue-list"></div>

          <button
            id="abort-button"
            class="queue-abort"
            type="button"
          >
            中断
          </button>
        </aside>
      </div>

      <p class="hint">
        オーブまたは空白レーンをタップ<br>
        同じレーンをもう一度タップで即固定
      </p>

      <div
        id="countdown-overlay"
        class="overlay hidden"
        aria-live="assertive"
      >
        <strong id="countdown-text">READY?</strong>
      </div>

      <div
        id="over-popup"
        class="over-popup hidden"
        aria-live="assertive"
      ></div>
    </section>

    <section id="tutorial-screen" class="screen tutorial">
      <button
        id="tutorial-exit-button"
        class="tutorial-exit"
        type="button"
      >
        メニュー
      </button>

      <div class="tutorial-card">
        <strong id="tutorial-step">1 / 5</strong>
        <p id="tutorial-text"></p>
      </div>

      <button
        id="tutorial-next-button"
        class="menu-button primary"
        type="button"
      >
        <strong>つぎへ</strong>
        <small>NEXT</small>
      </button>
    </section>

    <section id="tutorial-complete-modal" class="modal">
      <div class="modal-card">
        <h2>準備完了。</h2>

        <button
          id="tutorial-start-button"
          class="menu-button primary"
          type="button"
        >
          <strong>スタート</strong>
          <small>START</small>
        </button>

        <button
          id="tutorial-restart-button"
          class="menu-button"
          type="button"
        >
          <strong>もう一度</strong>
          <small>RETRY</small>
        </button>

        <button
          id="tutorial-title-button"
          class="menu-button"
          type="button"
        >
          <strong>メニューへ戻る</strong>
          <small>MENU</small>
        </button>
      </div>
    </section>

    <section id="abort-modal" class="modal">
      <div class="modal-card">
        <h2>ゲームを中断しました</h2>

        <button
          id="abort-resume-button"
          class="menu-button primary"
          type="button"
        >
          <strong>つづける</strong>
          <small>RESUME</small>
        </button>

        <button
          id="abort-retry-button"
          class="menu-button"
          type="button"
        >
          <strong>リトライ</strong>
          <small>RETRY</small>
        </button>

        <button
          id="abort-title-button"
          class="menu-button"
          type="button"
        >
          <strong>メニューへ戻る</strong>
          <small>MENU</small>
        </button>
      </div>
    </section>

    <section id="game-over-modal" class="modal">
      <div class="modal-card">
        <p id="game-over-reason" class="eyebrow">TIME UP</p>

        <h2>ゲーム終了</h2>

        <p>今回の獲得経験値</p>

        <strong
          id="final-score-value"
          class="final-score"
        >0</strong>

        <button
          id="retry-button"
          class="menu-button primary"
          type="button"
        >
          <strong>もう一度</strong>
          <small>RETRY</small>
        </button>

        <button
          id="title-button"
          class="menu-button"
          type="button"
        >
          <strong>メニューへ戻る</strong>
          <small>MENU</small>
        </button>
      </div>
    </section>

    <section id="game-clear-modal" class="modal">
      <div class="modal-card clear-card">
        <p class="eyebrow">MISSION COMPLETE</p>

        <h2>GAME CLEAR</h2>

        <p>
          すべてのLEVELを突破した。<br>
          今回の獲得経験値
        </p>

        <strong
          id="clear-score-value"
          class="final-score"
        >0</strong>

        <button
          id="clear-retry-button"
          class="menu-button primary"
          type="button"
        >
          <strong>もう一度</strong>
          <small>RETRY</small>
        </button>

        <button
          id="clear-title-button"
          class="menu-button"
          type="button"
        >
          <strong>メニューへ戻る</strong>
          <small>MENU</small>
        </button>
      </div>
    </section>

  </main>

  <script src="script.js?v=20261118-10"></script>
</body>
</html>
