<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >
  <title>とーたるえいと❣️</title>
  <link rel="stylesheet" href="style.css?v=20261118-12">
</head>

<body>
  <main class="app">

    <!-- 音に反応する万華鏡・幾何学背景 -->
    <div class="stage-lights" aria-hidden="true">
      <i class="stage-light stage-light--left"></i>
      <i class="stage-light stage-light--right"></i>
      <i class="stage-light stage-light--center"></i>
      <i class="stage-laser stage-laser--left"></i>
      <i class="stage-laser stage-laser--right"></i>
      <div class="stage-particles"></div>
    </div>

    <!-- タイトル画面 -->
    <section id="title-screen" class="screen is-active">
      <div class="title-content">
        <p class="eyebrow">CONNECT · CALCULATE · CLEAR</p>

        <h1>とーたるえいと<span>❣️</span></h1>

        <!-- タイトル右下のバージョン表記 -->
        <p
          style="
            width: fit-content;
            margin: -4px 2px 0 auto;
            color: #9caaca;
            font-family: Orbitron, sans-serif;
            font-size: 0.58rem;
            font-weight: 800;
            letter-spacing: 0.08em;
          "
        >
          ver1.1
        </p>

        <p class="lead">合計8にして高スコアを狙え</p>

        <div class="title-menu">
          <button
            id="start-button"
            class="menu-button primary"
            type="button"
          >
            <strong>スタート</strong>
            <small>START</small>
          </button>

          <button
            id="tutorial-button"
            class="menu-button"
            type="button"
          >
            <strong>チュートリアル</strong>
            <small>TUTORIAL</small>
          </button>
        </div>
      </div>
    </section>

    <!-- ゲーム画面 -->
    <section id="game-screen" class="screen">
      <header class="hud">
        <div class="hud-score">
          <span>経験値</span>
          <strong id="score-value">0</strong>
        </div>

        <div class="hud-level">
          <span>レベル</span>
          <strong id="level-value">1</strong>
        </div>

        <div class="hud-stage">
          <span>ステージ経験値</span>
          <strong>
            <b id="stage-score-value">0</b>
            <em>/</em>
            <b id="stage-target-value">4500</b>
          </strong>
        </div>

        <div class="hud-time">
          <span>残り時間</span>
          <strong id="time-value">300</strong>
        </div>

        <div class="hud-over">
          <span>オーバー</span>

          <p id="over-gauge">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
          </p>
        </div>
      </header>

      <strong id="status-label" class="status">READY</strong>

      <div class="play-area">
        <div
          id="game-board"
          class="board"
          aria-label="ゲーム盤面"
        ></div>

        <aside class="queue" aria-label="控えリング">
          <b>控え</b>

          <div id="ring-queue-list"></div>

          <button
            id="abort-button"
            class="queue-abort"
            type="button"
          >
            中断
          </button>
        </aside>
      </div>

      <p class="hint">
        オーブまたは空白レーンをタップ<br>
        同じレーンをもう一度タップで即固定
      </p>

      <!-- READY? / 3 / 2 / 1 / GO! -->
      <div
        id="countdown-overlay"
        class="overlay hidden"
        aria-live="assertive"
      >
        <strong id="countdown-text">READY?</strong>
      </div>

      <!-- 合計9以上を作った時の大きい数値 -->
      <div
        id="over-popup"
        class="over-popup hidden"
        aria-live="assertive"
      ></div>
    </section>

    <!-- チュートリアル -->
    <section id="tutorial-screen" class="screen tutorial">
      <button
        id="tutorial-exit-button"
        class="tutorial-exit"
        type="button"
      >
        メニュー
      </button>

      <div class="tutorial-card">
        <strong id="tutorial-step">1 / 5</strong>
        <p id="tutorial-text"></p>
      </div>

      <button
        id="tutorial-next-button"
        class="menu-button primary"
        type="button"
      >
        <strong>つぎへ</strong>
        <small>NEXT</small>
      </button>
    </section>

    <!-- チュートリアル終了 -->
    <section id="tutorial-complete-modal" class="modal">
      <div class="modal-card">
        <h2>準備完了。</h2>

        <button
          id="tutorial-start-button"
          class="menu-button primary"
          type="button"
        >
          <strong>スタート</strong>
          <small>START</small>
        </button>

        <button
          id="tutorial-restart-button"
          class="menu-button"
          type="button"
        >
          <strong>もう一度</strong>
          <small>RETRY</small>
        </button>

        <button
          id="tutorial-title-button"
          class="menu-button"
          type="button"
        >
          <strong>メニューへ戻る</strong>
          <small>MENU</small>
        </button>
      </div>
    </section>

    <!-- 中断 -->
    <section id="abort-modal" class="modal">
      <div class="modal-card">
        <h2>ゲームを中断しました</h2>

        <button
          id="abort-resume-button"
          class="menu-button primary"
          type="button"
        >
          <strong>つづける</strong>
          <small>RESUME</small>
        </button>

        <button
          id="abort-retry-button"
          class="menu-button"
          type="button"
        >
          <strong>リトライ</strong>
          <small>RETRY</small>
        </button>

        <button
          id="abort-title-button"
          class="menu-button"
          type="button"
        >
          <strong>メニューへ戻る</strong>
          <small>MENU</small>
        </button>
      </div>
    </section>

    <!-- ゲームオーバー -->
    <section id="game-over-modal" class="modal">
      <div class="modal-card">
        <p id="game-over-reason" class="eyebrow">TIME UP</p>

        <h2>ゲーム終了</h2>

        <p>今回の獲得経験値</p>

        <strong
          id="final-score-value"
          class="final-score"
        >0</strong>

        <button
          id="retry-button"
          class="menu-button primary"
          type="button"
        >
          <strong>もう一度</strong>
          <small>RETRY</small>
        </button>

        <button
          id="title-button"
          class="menu-button"
          type="button"
        >
          <strong>メニューへ戻る</strong>
          <small>MENU</small>
        </button>
      </div>
    </section>

    <!-- ゲームクリア -->
    <section id="game-clear-modal" class="modal">
      <div class="modal-card clear-card">
        <p class="eyebrow">MISSION COMPLETE</p>

        <h2>GAME CLEAR</h2>

        <p>
          すべてのLEVELを突破した。<br>
          今回の獲得経験値
        </p>

        <strong
          id="clear-score-value"
          class="final-score"
        >0</strong>

        <button
          id="clear-retry-button"
          class="menu-button primary"
          type="button"
        >
          <strong>もう一度</strong>
          <small>RETRY</small>
        </button>

        <button
          id="clear-title-button"
          class="menu-button"
          type="button"
        >
          <strong>メニューへ戻る</strong>
          <small>MENU</small>
        </button>
      </div>
    </section>

  </main>

  <script src="script.js?v=20261118-12"></script>
</body>
</html>
