<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#100b22">
<title>とーたるえいと❣️ ver1.3</title>

<style>
:root {
  --bg: #100b22;
  --panel: #211637;
  --panel2: #30204a;
  --pink: #ff58c8;
  --cyan: #55eaff;
  --yellow: #ffe66d;
  --white: #fff;
  --text: #f5efff;
  --muted: #a99bc7;
  --cell-gap: 5px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", sans-serif;
  user-select: none;
  -webkit-user-select: none;
}

body {
  display: flex;
  justify-content: center;
}

button {
  border: none;
  color: white;
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(.97);
}

#app {
  position: relative;
  width: min(100%, 520px);
  height: 100dvh;
  height: 100%;
  min-height: 0;
  padding:
    max(7px, env(safe-area-inset-top))
    10px
    max(7px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 0%, #422462 0%, transparent 55%),
    linear-gradient(180deg, #160e2b, #090714);
}

.screen {
  display: none;
  width: 100%;
  height: 100%;
  min-height: 0;
  flex-direction: column;
  overflow: hidden;
}

.screen.active {
  display: flex;
}

#titleScreen {
  position: relative;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 18px 12px;
}

.logo {
  font-size: clamp(34px, 10vw, 52px);
  font-weight: 1000;
  letter-spacing: -2px;
  line-height: 1.1;
  text-shadow:
    0 0 12px #ff53d9,
    0 0 35px #8e36ff;
  animation: logoPulse 2.5s ease-in-out infinite;
}

.version {
  display: block;
  text-align: right;
  font-size: 12px;
  color: #d5c0ff;
  margin-top: 4px;
  padding-right: 8px;
}

.catch {
  margin: 18px 0 28px;
  font-size: 16px;
  color: #d8c8ff;
  letter-spacing: 2px;
}

.menuButtons {
  width: min(100%, 320px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.mainBtn {
  padding: 14px;
  border-radius: 18px;
  background: linear-gradient(135deg, #d92ea9, #7636d8);
  box-shadow: 0 5px 0 #45236c, 0 0 20px #b33dcb55;
  font-weight: 900;
  font-size: 18px;
}

.subBtn {
  padding: 12px;
  border-radius: 14px;
  background: #302348;
  border: 1px solid #6d5593;
  font-weight: 700;
}

#gameScreen {
  gap: 5px;
}

.hud {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1.35fr;
  gap: 4px;
  flex-shrink: 0;
}

.hudItem {
  min-width: 0;
  text-align: center;
  padding: 5px 2px;
  border-radius: 9px;
  background: #271a40;
  border: 1px solid #493361;
}

.hudLabel {
  font-size: 9px;
  color: #ad9bce;
  line-height: 1;
}

.hudValue {
  font-size: clamp(12px, 3.5vw, 15px);
  font-weight: 900;
  line-height: 1.4;
  white-space: nowrap;
}

#stageXP {
  font-size: clamp(10px, 3vw, 12px);
}

.overGauge {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 2px 0;
  flex-shrink: 0;
}

.gauge {
  width: 24px;
  height: 9px;
  border-radius: 20px;
  background: #3a2c4b;
  border: 1px solid #614568;
  transition: .2s;
}

.gauge.on {
  background: #ff49bd;
  border-color: #ffb2e9;
  box-shadow: 0 0 10px #ff49bd;
  animation: gaugeBlink var(--blinkSpeed, 1.2s) infinite;
}

#status {
  height: 25px;
  flex-shrink: 0;
  text-align: center;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 1.5px;
  color: var(--cyan);
  text-shadow: 0 0 8px currentColor;
  display: flex;
  justify-content: center;
  align-items: center;
}

.nextArea {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  flex-shrink: 0;
}

.nextLane {
  border-radius: 9px;
  padding: 3px;
  background: #211633;
  border: 1px solid #48335e;
  text-align: center;
  min-width: 0;
}

.laneName {
  font-size: 9px;
  letter-spacing: .5px;
  color: #b8a3db;
  font-weight: 800;
}

.nextPiece {
  height: 29px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nextPiece .piece {
  width: 24px;
  height: 24px;
}

.boardWrap {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 5px;
  border: 2px solid #674b88;
  border-radius: 14px;
  background:
    linear-gradient(180deg, #160e2c, #100b20);
  box-shadow:
    inset 0 0 20px #5d2e8a30,
    0 0 15px #7c3dbe22;
}

.board {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(8, 1fr);
  gap: var(--cell-gap);
}

.cell {
  position: relative;
  min-width: 0;
  min-height: 0;
  border-radius: 7px;
  background: #211837;
  border: 1px solid #35264c;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

.cell.activeCell {
  border-color: #ff73d9;
  box-shadow: inset 0 0 12px #ff56ca40;
}

.cell.laneHighlight {
  background: #372447;
}

.piece {
  width: 90%;
  height: 90%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  font-weight: 1000;
  font-size: clamp(13px, 4vw, 23px);
  line-height: 1;
  color: white;
  text-shadow:
    0 2px 3px #000,
    0 0 6px #000;
}

.ringPiece {
  border-radius: 50%;
  border: 4px solid var(--pieceColor, #d7d7ff);
  background: radial-gradient(circle, transparent 53%, #ffffff12 55%, transparent 72%);
  box-shadow:
    inset 0 0 8px var(--pieceColor),
    0 0 7px var(--pieceColor);
}

.ringPiece::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  border: 1px solid var(--pieceColor);
  opacity: .5;
}

.orbPiece {
  border-radius: 50%;
  border: 2px solid #ffffff;
  background:
    radial-gradient(circle at 30% 25%, #ffffffaa 0%, transparent 25%),
    radial-gradient(circle at 35% 30%, var(--pieceColor), #171022 95%);
  box-shadow:
    0 0 8px var(--pieceColor),
    0 0 15px var(--pieceColor);
}

.starPiece {
  color: #fff8a0;
  font-size: clamp(18px, 5vw, 26px);
  text-shadow: 0 0 8px #ffdb39;
}

.falling {
  position: absolute;
  z-index: 10;
  width: 0;
  height: 0;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: top .12s linear, left .12s ease;
}

.falling .piece {
  width: 82%;
  height: 82%;
}

.boardFoot {
  height: 3px;
  flex-shrink: 0;
}

.bottomControls {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
}

.hint {
  flex: 1;
  text-align: center;
  font-size: 10px;
  color: #a999c5;
  line-height: 1.4;
}

.pauseBtn {
  flex-shrink: 0;
  padding: 8px 22px;
  border-radius: 12px;
  font-weight: 900;
  background: #54317b;
  border: 1px solid #a276d2;
}

#overlay {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #090512b9;
  backdrop-filter: blur(5px);
}

#overlay.show {
  display: flex;
}

.overlayCard {
  width: 100%;
  max-width: 380px;
  max-height: 90%;
  overflow-y: auto;
  border-radius: 22px;
  padding: 22px 18px;
  background: linear-gradient(180deg, #362050, #1b112e);
  border: 1px solid #9b6ec7;
  box-shadow: 0 0 30px #c94dd655;
  text-align: center;
}

.overlayTitle {
  font-size: 25px;
  font-weight: 1000;
  margin-bottom: 14px;
  color: #fff;
  text-shadow: 0 0 10px #ff6be1;
}

.overlayText {
  font-size: 14px;
  line-height: 1.8;
  color: #e5d8ff;
  white-space: pre-line;
}

.overlayButtons {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 18px;
}

.overlayButtons button {
  padding: 12px;
  border-radius: 13px;
  font-weight: 900;
  background: #7543a7;
}

.overlayButtons button.primary {
  background: linear-gradient(135deg, #f044c3, #7e3be0);
}

#effects {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 30;
}

.effectText {
  position: absolute;
  left: 50%;
  top: 48%;
  transform: translate(-50%, -50%);
  font-weight: 1000;
  text-align: center;
  color: white;
  text-shadow:
    0 0 8px currentColor,
    0 0 25px currentColor,
    0 4px 5px #000;
  white-space: nowrap;
  animation: effectPop .9s ease-out forwards;
}

.effectText.over {
  color: #ff4bbd;
  font-size: clamp(60px, 22vw, 110px);
}

.effectText.level {
  color: #ffe66d;
  font-size: clamp(38px, 13vw, 70px);
}

.effectText.fever {
  color: #ff7fe6;
  font-size: clamp(44px, 15vw, 80px);
  animation: feverAnim 1.5s ease-in-out forwards;
}

.effectText.clear {
  color: #7bffec;
  font-size: clamp(35px, 12vw, 70px);
}

.effectText.count {
  color: #fff;
  font-size: clamp(65px, 22vw, 115px);
}

.effectText.ready {
  color: #ffe66d;
  font-size: clamp(30px, 11vw, 60px);
  animation: readyAnim 1.1s ease forwards;
}

#tutorialScreen,
#historyScreen {
  padding: 8px;
  justify-content: center;
}

.pageCard {
  background: #211633;
  border: 1px solid #6d5593;
  border-radius: 20px;
  padding: 20px 17px;
}

.pageTitle {
  font-size: 23px;
  font-weight: 1000;
  color: #ff88e3;
  text-align: center;
  margin-bottom: 18px;
}

.pageBody {
  line-height: 1.9;
  font-size: 14px;
  min-height: 180px;
  white-space: pre-line;
}

.pageFooter {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.pageFooter button {
  flex: 1;
  border-radius: 12px;
  padding: 12px;
  background: #52347a;
  font-weight: 800;
}

#soundBtn {
  position: absolute;
  right: 10px;
  top: max(10px, env(safe-area-inset-top));
  padding: 7px 10px;
  border-radius: 12px;
  background: #30214b;
  border: 1px solid #77559a;
  font-size: 11px;
  z-index: 3;
}
#gameScreen #soundBtnGame {
  position: static;
  width: 100%;
  height: 100%;
  min-height: 38px;
  padding: 3px 2px;
  border-radius: 9px;
  font-size: 10px;
  white-space: nowrap;
}
.hud { grid-template-columns: 1fr 1fr 1fr 1.35fr .8fr; }
.board { position: relative; }
.board, .boardWrap, .cell { touch-action: none; }


@keyframes logoPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.025); }
}

@keyframes gaugeBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}

@keyframes effectPop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  100% { opacity: 0; transform: translate(-50%, -65%) scale(1); }
}

@keyframes feverAnim {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-30deg); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(10deg); }
  60% { transform: translate(-50%, -50%) scale(.95) rotate(-6deg); }
  100% { opacity: 0; transform: translate(-50%, -65%) scale(1.3) rotate(8deg); }
}

@keyframes readyAnim {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.15); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  70% { transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(.9); }
}

@media (max-height: 690px) {
  .hudItem { padding: 3px 1px; }
  #status { height: 20px; font-size: 11px; }
  .nextPiece { height: 23px; }
  .nextPiece .piece { width: 20px; height: 20px; }
  .boardWrap { padding: 3px; }
  :root { --cell-gap: 3px; }
  .bottomControls { padding: 1px 0; }
  .pauseBtn { padding: 6px 17px; }
}

@media (max-height: 600px) {
  .catch { margin: 10px 0 18px; }
  .mainBtn { padding: 10px; }
  .subBtn { padding: 9px; }
}
</style>
</head>

<body>
<div id="app">


  <!-- TITLE -->
  <section id="titleScreen" class="screen active">
  <button id="soundBtn" onclick="toggleSound()">🔇 音 OFF</button>
    <div>
      <div class="logo">とーたるえいと❣️</div>
      <div class="version">ver1.3</div>
    </div>

    <div class="catch">落として、つないで、合計8。</div>

    <div class="menuButtons">
      <button class="mainBtn" onclick="startGame()">▶ スタート</button>
      <button class="subBtn" onclick="showTutorial()">📖 チュートリアル</button>
      <button class="subBtn" onclick="showHistory()">🛠 改修履歴</button>
      <button class="subBtn" onclick="refreshGame()">🔄 更新</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="gameScreen" class="screen">

    <div class="hud">
      <div class="hudItem">
        <div class="hudLabel">経験値</div>
        <div class="hudValue" id="totalXP">0</div>
      </div>

      <div class="hudItem">
        <div class="hudLabel">LEVEL</div>
        <div class="hudValue" id="levelDisplay">1</div>
      </div>

      <div class="hudItem">
        <div class="hudLabel">TIME</div>
        <div class="hudValue" id="timeDisplay">300</div>
      </div>

      <div class="hudItem">
        <div class="hudLabel">STAGE XP</div>
        <div class="hudValue" id="stageXP">0 / 1,800</div>
      </div>
      <button id="soundBtnGame" class="hudItem" onclick="toggleSound()">🔇 音 OFF</button>
    </div>

    <div class="overGauge" id="overGauge">
      <div class="gauge"></div>
      <div class="gauge"></div>
      <div class="gauge"></div>
      <div class="gauge"></div>
      <div class="gauge"></div>
    </div>

    <div id="status">DROP RING</div>

    <div class="nextArea" id="nextArea"></div>

    <div class="boardWrap">
      <div class="board" id="board"></div>
    </div>

    <div class="bottomControls">
      <div class="hint">
        レーンをタップ：移動<br>
        同じレーンを再タップ：即落下
      </div>
      <button class="pauseBtn" onclick="pauseGame()">⏸ 中断</button>
    </div>

  </section>

  <!-- TUTORIAL -->
  <section id="tutorialScreen" class="screen">
    <div class="pageCard">
      <div class="pageTitle" id="tutorialTitle">チュートリアル</div>
      <div class="pageBody" id="tutorialBody"></div>
      <div class="pageFooter">
        <button onclick="tutorialPrev()">◀ 前へ</button>
        <button onclick="tutorialNext()">次へ ▶</button>
      </div>
      <div class="pageFooter">
        <button onclick="showScreen('titleScreen')">メニューへ戻る</button>
      </div>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="historyScreen" class="screen">
    <div class="pageCard">
      <div class="pageTitle">改修履歴 ver1.3</div>
      <div class="pageBody" id="historyBody"></div>
      <div class="pageFooter">
        <button onclick="showScreen('titleScreen')">メニューへ戻る</button>
      </div>
    </div>
  </section>

  <!-- OVERLAY -->
  <div id="overlay">
    <div class="overlayCard">
      <div class="overlayTitle" id="overlayTitle"></div>
      <div class="overlayText" id="overlayText"></div>
      <div class="overlayButtons" id="overlayButtons"></div>
    </div>
  </div>

  <div id="effects"></div>
</div>

<script>
"use strict";

/* =========================================================
   とーたるえいと❣️ ver1.3
   Single-file mobile game
========================================================= */

const COLS = 4;
const ROWS = 8;
const START_TIME = 300;
const FEVER_TIME = 8;

const STAGE_TARGETS = [3600, 7200, 10800, 21600, 32400];
const DROP_SPEEDS = [1800, 1650, 1450, 1050, 1050];

const RING_COLORS = [
  "#dffaff",
  "#77f4ff",
  "#b7a1ff",
  "#ff9de8",
  "#8dffcf",
  "#ffc8fb"
];

const ORB_COLORS = [
  "#58eaff",
  "#a279ff",
  "#ff68d0",
  "#5effa8",
  "#ffd75d",
  "#ff8c65"
];

const TUTORIAL_PAGES = [
  {
    title: "1. リングを落とそう",
    body:
`上から数字付きリングが落ちてきます。

4本のレーンの好きな場所をタップすると、
落下中のリングを別レーンへ移動できます。

移動してもリングの高さはリセットされません。
空いている同じ高さのマスへ移動します。`
  },
  {
    title: "2. 同じレーンを再タップ",
    body:
`落下中リングがいるレーンをもう一度タップ！

リングはそのレーンの最下部、
または積み上がったピースの直上まで
一気に落下して固定されます。`
  },
  {
    title: "3. 合計8を作ろう！",
    body:
`オーブとリング、またはリング同士の合計が
8になると消去されます。

オーブがあるレーンの8消去では経験値獲得！

リングだけのレーンも合計8で消えますが、
経験値は獲得できません。`
  },
  {
    title: "4. 9以上はOVER LIMIT",
    body:
`合計が9以上になるとオーバー！

今回落としたリングだけが消え、
オーバーゲージが1本増えます。

5本点灯するとゲームオーバー！
積みすぎには注意しましょう。`
  },
  {
    title: "5. ★リング",
    body:
`低確率で★リングが出現します。

★を固定すると、そのレーンのピースを
すべて消去できます。

消したピース数に応じて経験値獲得！
全盤面を空にするとFEVER発動！

FEVER中は経験値4倍！`
  }
];

const HISTORY_TEXT =
`ver1.3

・縦持ちの4レーン落下パズルへ変更
・リングだけの列も合計8で消えるよう修正
・オーブ付きの合計8は経験値獲得
・リングだけの合計8は経験値なし
・9以上なら新リング消去とオーバーゲージ増加
・LEVEL UP後もリングが必ず再開するよう修正
・オーブ全消去後、完全に空のレーンだけへオーブ追加
・リングが残るレーンにはオーブを追加しない
・FEVER中は経験値4倍
・縦持ちスマートフォン画面に最適化
・落下リングは1～4、オーブは1～4
・レベル経験値目標（倍増）：3600 / 7200 / 10800 / 21600 / 32400
・Lv.5目標達成でゲームクリア、最大Lv.5
・OVER LIMIT時は最上段リングを消去
・音ボタンをHUD内に分離配置
・ダブルタップ/ピンチズームを抑止
・READY? → 3 → 2 → 1 → GO! 演出追加
・LEVEL UP、FEVER、OVER LIMIT演出を追加
・Web Audio APIによる効果音追加`;

/* =========================================================
   GAME STATE
========================================================= */

const game = {
  active: false,
  busy: false,
  paused: false,
  level: 1,
  totalXP: 0,
  stageXP: 0,
  time: START_TIME,
  over: 0,
  fever: false,
  feverTime: 0,
  falling: null,
  board: [],
  nextRings: [],
  dropTimer: null,
  clockTimer: null,
  feverTimer: null,
  audioEnabled: false,
  audioContext: null,
  bgm: null,
  bgmFade: null,
  combo: 0,
  soundStep: 0,
  session: 0
};

function newBoard() {
  return Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => null)
  );
}

/* =========================================================

/* =========================================================
   AUDIO
========================================================= */

function initAudio() {
  if (!game.audioContext) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) game.audioContext = new AC();
  }

  if (game.audioContext && game.audioContext.state === "suspended") {
    game.audioContext.resume();
  }
}

function toggleSound() {
  initAudio();
  game.audioEnabled = !game.audioEnabled;

  const buttons = [document.getElementById("soundBtn"), document.getElementById("soundBtnGame")].filter(Boolean);

  if (game.audioEnabled) {
    buttons.forEach(button => button.textContent = "🔊 音 ON");
    if (game.active && !game.paused) playBGM();
  } else {
    buttons.forEach(button => button.textContent = "🔇 音 OFF");
    stopBGM();
  }
}

function tone(freq, duration = .12, type = "sine", volume = .18,
              delay = 0) {
  if (!game.audioEnabled) return;

  initAudio();
  const ctx = game.audioContext;
  if (!ctx) return;

  const start = ctx.currentTime + delay;

  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = type;
  oscillator.frequency.setValueAtTime(freq, start);

  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + .01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start(start);
  oscillator.stop(start + duration + .03);
}

function soundConnect() {
  tone(160, .1, "square", .12);
  tone(100, .14, "triangle", .18, .03);
}

function soundOver() {
  tone(523, .22, "triangle", .15);
  tone(392, .25, "triangle", .15, .18);
  tone(294, .28, "triangle", .15, .38);
  tone(196, .35, "triangle", .15, .58);
}

function soundClear(combo = 0) {
  const notes = [261.63, 293.66, 329.63, 349.23,
                 392, 440, 493.88, 523.25];

  const speed = Math.max(.065, .13 - combo * .015);

  for (let i = 0; i < 8; i++) {
    tone(notes[i] * Math.pow(1.05946, game.level - 1),
         .12, "sine", .11, i * speed);
  }
}

function soundStar() {
  tone(880, .12, "sine", .16);
  tone(1174, .15, "sine", .14, .08);
  tone(1568, .22, "sine", .13, .16);
}

function soundLevelUp() {
  [440, 554, 659, 880, 1108].forEach((f, i) => {
    tone(f, .2, "sine", .16, i * .1);
  });
}

function soundFever() {
  [523, 659, 784, 1046, 1318].forEach((f, i) => {
    tone(f, .3, "sine", .17, i * .08);
  });
}

function getBGMPath(level) {
  if (level <= 3) {
    return `assets/audio/bgm/LEVEL-${level}.mp3`;
  }

  if (level === 4) {
    return Math.random() < .5
      ? "assets/audio/bgm/LEVEL-4-a.mp3"
      : "assets/audio/bgm/LEVEL-4-b.mp3";
  }

  return Math.random() < .5
    ? "assets/audio/bgm/LEVEL-5-a.mp3"
    : "assets/audio/bgm/LEVEL-5-b.mp3";
}

function playBGM(path = getBGMPath(game.level)) {
  if (!game.audioEnabled) return;

  stopBGM();

  const audio = new Audio(path);
  audio.loop = true;
  audio.volume = .5;
  audio.addEventListener("ended", () => {
    if (game.active && !game.paused && game.audioEnabled && game.level >= 5 && game.bgm === audio) {
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }
  });

  game.bgm = audio;
  audio.play().catch(() => {});
}

function stopBGM() {
  if (game.bgm) {
    try {
      game.bgm.pause();
      game.bgm.currentTime = 0;
    } catch(e) {}
    game.bgm = null;
  }
}

function playEndBGM(path) {
  stopBGM();
  if (!game.audioEnabled) return;

  const audio = new Audio(path);
  audio.loop = false;
  audio.volume = .7;
  game.bgm = audio;
  audio.play().catch(() => {});
}

/* =========================================================
   GAME START / RESET
========================================================= */

function startGame() {
  initAudio();

  game.session++;
  clearTimers();

  game.active = false;
  game.busy = true;
  game.paused = false;

  game.level = 1;
  game.totalXP = 0;
  game.stageXP = 0;
  game.time = START_TIME;
  game.over = 0;
  game.fever = false;
  game.feverTime = 0;
  game.falling = null;
  game.board = newBoard();
  game.combo = 0;
  game.soundStep = 0;

  stopBGM();

  showScreen("gameScreen");
  hideOverlay();

  for (let c = 0; c < COLS; c++) {
    game.board[ROWS - 1][c] = createOrb();
  }

  game.nextRings = Array.from({ length: COLS }, () => generateRing());

  renderAll();
  startClock();

  countdown(game.session);
}

function refreshGame() {
  const url = new URL(window.location.href);
  url.searchParams.set("refresh", Date.now());
  window.location.href = url.toString();
}

function clearTimers() {
  clearInterval(game.dropTimer);
  clearInterval(game.clockTimer);
  clearInterval(game.feverTimer);

  game.dropTimer = null;
  game.clockTimer = null;
  game.feverTimer = null;
}

async function countdown(session) {
  const sequence = ["READY?", "3", "2", "1", "GO!"];

  for (let i = 0; i < sequence.length; i++) {
    if (session !== game.session) return;

    showEffect(sequence[i],
      i === 0 ? "ready" : "count",
      900);

    if (i === 0) {
      setStatus("GET READY", "var(--yellow)");
    } else if (i === 4) {
      setStatus("DROP RING");
    } else {
      tone(440 + (3 - i) * 80, .12, "sine", .1);
    }

    await wait(i === 0 ? 950 : 800);
  }

  if (session !== game.session) return;

  game.active = true;
  game.busy = false;

  if (game.audioEnabled) playBGM();

  spawnRing();
  startDropTimer();
  renderAll();
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

/* =========================================================
   PIECES
========================================================= */

function createOrb() {
  return {
    type: "orb",
    value: Math.floor(Math.random() * 4) + 1,
    color: ORB_COLORS[Math.floor(Math.random() * ORB_COLORS.length)]
  };
}

function generateRing() {
  if (Math.random() < .05) {
    return {
      type: "star",
      value: 0,
      color: "#ffe66d"
    };
  }

  const value = Math.floor(Math.random() * 4) + 1;

  return {
    type: "ring",
    value,
    color: RING_COLORS[Math.floor(Math.random() * RING_COLORS.length)]
  };
}

function makePieceElement(piece) {
  const div = document.createElement("div");

  if (piece.type === "orb") {
    div.className = "piece orbPiece";
    div.style.setProperty("--pieceColor", piece.color);
    div.textContent = piece.value;
  } else if (piece.type === "star") {
    div.className = "piece starPiece";
    div.textContent = "★";
  } else {
    div.className = "piece ringPiece";
    div.style.setProperty("--pieceColor", piece.color);
    div.textContent = piece.value;
  }

  return div;
}

/* =========================================================
   RENDER
========================================================= */

function renderAll() {
  renderHUD();
  renderGauge();
  renderNext();
  renderBoard();
  renderFalling();
}

function renderHUD() {
  document.getElementById("totalXP").textContent =
    game.totalXP.toLocaleString();

  document.getElementById("levelDisplay").textContent =
    game.level;

  document.getElementById("timeDisplay").textContent =
    Math.max(0, Math.ceil(game.time));

  const target = STAGE_TARGETS[game.level - 1] || STAGE_TARGETS[4];

  document.getElementById("stageXP").textContent =
    game.stageXP.toLocaleString() + " / " +
    target.toLocaleString();
}

function renderGauge() {
  const gauges = document.querySelectorAll(".gauge");

  gauges.forEach((g, i) => {
    g.classList.toggle("on", i < game.over);
  });

  let speed = "1.2s";

  if (game.over === 2) speed = ".9s";
  if (game.over === 3) speed = ".65s";
  if (game.over >= 4) speed = ".4s";

  document.documentElement.style.setProperty("--blinkSpeed", speed);
}

function renderNext() {
  const area = document.getElementById("nextArea");
  area.innerHTML = "";

  for (let c = 0; c < COLS; c++) {
    const box = document.createElement("div");
    box.className = "nextLane";

    const name = document.createElement("div");
    name.className = "laneName";
    name.textContent = "LANE " + (c + 1);

    const pieceArea = document.createElement("div");
    pieceArea.className = "nextPiece";

    const piece = game.nextRings[c];
    if (piece) {
      pieceArea.appendChild(makePieceElement(piece));
    }

    box.appendChild(name);
    box.appendChild(pieceArea);
    area.appendChild(box);
  }
}

function renderBoard() {
  const boardEl = document.getElementById("board");
  boardEl.innerHTML = "";

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";

      if (game.falling && game.falling.col === c) {
        cell.classList.add("laneHighlight");
      }

      cell.dataset.row = r;
      cell.dataset.col = c;

      const piece = game.board[r][c];

      if (piece) {
        cell.appendChild(makePieceElement(piece));
      }

      cell.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        tapLane(c);
      });

      boardEl.appendChild(cell);
    }
  }
}

function renderFalling() {
  const old = document.getElementById("fallingPiece");
  if (old) old.remove();
  if (!game.falling) return;

  const boardEl = document.getElementById("board");
  const cell = boardEl.querySelector(`.cell[data-row="${game.falling.row}"][data-col="${game.falling.col}"]`);
  if (!cell) return;

  const pieceEl = document.createElement("div");
  pieceEl.id = "fallingPiece";
  pieceEl.className = "falling";
  pieceEl.style.left = `${cell.offsetLeft}px`;
  pieceEl.style.top = `${cell.offsetTop}px`;
  pieceEl.style.width = `${cell.offsetWidth}px`;
  pieceEl.style.height = `${cell.offsetHeight}px`;
  pieceEl.appendChild(makePieceElement(game.falling.piece));
  boardEl.appendChild(pieceEl);
}

/* =========================================================
   RING SPAWN / DROP
========================================================= */

function spawnRing() {
  if (!game.active || game.busy || game.paused) return;
  if (game.falling) return;

  const lane = Math.floor(Math.random() * COLS);
  const piece = game.nextRings[lane] || generateRing();

  game.nextRings[lane] = generateRing();

  game.falling = {
    col: lane,
    row: 0,
    piece
  };

  setStatus("DROP RING");
  renderAll();
}

function startDropTimer() {
  clearInterval(game.dropTimer);

  const speed = DROP_SPEEDS[game.level - 1];

  game.dropTimer = setInterval(() => {
    if (!game.active || game.busy || game.paused) return;
    if (!game.falling) return;

    dropOneStep();
  }, speed);
}

function dropOneStep() {
  if (!game.falling) return;

  const { col, row } = game.falling;
  const nextRow = row + 1;

  if (nextRow >= ROWS || game.board[nextRow][col]) {
    fixFallingPiece();
    return;
  }

  game.falling.row = nextRow;
  renderFalling();
}

function tapLane(col) {
  if (!game.active || game.busy || game.paused) return;
  if (!game.falling) return;

  if (game.falling.col === col) {
    instantDrop();
    return;
  }

  const row = game.falling.row;

  if (game.board[row][col]) {
    return;
  }

  game.falling.col = col;
  renderAll();
}

function instantDrop() {
  if (!game.falling || game.busy) return;

  const col = game.falling.col;
  let row = game.falling.row;

  while (row + 1 < ROWS && !game.board[row + 1][col]) {
    row++;
  }

  game.falling.row = row;
  renderFalling();

  fixFallingPiece();
}

/* =========================================================
   FIX / MATCH / CHAIN
========================================================= */

async function fixFallingPiece() {
  if (!game.falling || game.busy) return;

  game.busy = true;

  const falling = game.falling;
  const col = falling.col;
  const row = falling.row;
  const piece = falling.piece;

  game.falling = null;

  if (game.board[row][col]) {
    // Safety: search nearest free cell below the current position.
    let target = row - 1;
    while (target >= 0 && game.board[target][col]) target--;

    if (target < 0) {
      game.busy = false;
      spawnRing();
      return;
    }
  }

  game.board[row][col] = piece;

  soundConnect();
  renderAll();

  await wait(80);

  if (piece.type === "star") {
    await resolveStar(col);
  } else {
    await resolveLane(col, true);
  }

  if (!game.active) return;

  await checkOrbRefillAndFever();

  if (!game.active) return;

  if (game.level >= 5 &&
      game.stageXP >= STAGE_TARGETS[4]) {
    gameClear();
    return;
  }

  game.busy = false;
  spawnRing();
  renderAll();
}

/* Sum pieces in a lane */
function getLanePieces(col) {
  const list = [];

  for (let r = 0; r < ROWS; r++) {
    if (game.board[r][col]) {
      list.push({
        row: r,
        piece: game.board[r][col]
      });
    }
  }

  return list;
}

function getLaneSum(col) {
  return getLanePieces(col).reduce((sum, item) => {
    if (item.piece.type === "star") return sum;
    return sum + item.piece.value;
  }, 0);
}

function laneHasOrb(col) {
  return getLanePieces(col).some(item =>
    item.piece.type === "orb"
  );
}

function compactLane(col) {
  const pieces = [];

  for (let r = ROWS - 1; r >= 0; r--) {
    if (game.board[r][col]) {
      pieces.push(game.board[r][col]);
    }
  }

  for (let r = 0; r < ROWS; r++) {
    game.board[r][col] = null;
  }

  let r = ROWS - 1;

  for (const piece of pieces) {
    game.board[r][col] = piece;
    r--;
  }
}

async function resolveLane(col, isNewRing) {
  let chain = 0;
  let newRing = isNewRing;

  while (game.active) {
    compactLane(col);

    const pieces = getLanePieces(col);
    const sum = getLaneSum(col);
    const hasOrb = laneHasOrb(col);

    // Sum 8: clear the entire lane.
    if (sum === 8 && pieces.length > 0) {
      chain++;

      if (hasOrb) {
        setStatus(chain > 1 ? "CHAIN ×" + chain : "TOTAL 8!");
        gainXP(1000, chain);
      } else {
        setStatus("RING CLEAR!");
      }

      soundClear(chain - 1);

      for (const item of pieces) {
        game.board[item.row][col] = null;
      }

      renderAll();
      await wait(380);

      compactLane(col);
      newRing = false;
      continue;
    }

    // Over limit only for the newly fixed piece.
    if (sum >= 9 && newRing) {
      setStatus("OVER LIMIT", "var(--pink)");

      showEffect(String(sum), "over", 1000);
      soundOver();

      // Over-limit removes the uppermost ring in the stack (smallest row index).
      const lane = getLanePieces(col);
      const uppermostRing = lane
        .filter(item => item.piece.type === "ring")
        .sort((a, b) => a.row - b.row)[0];
      if (uppermostRing) game.board[uppermostRing.row][col] = null;

      game.over++;
      renderGauge();
      renderAll();

      await wait(750);

      if (game.over >= 5) {
        gameOver();
        return;
      }

      newRing = false;
      compactLane(col);
      break;
    }

    // Automatically created sum 9+ from compaction:
    // no new piece => don't increase the gauge.
    if (sum >= 9 && !newRing) {
      setStatus("CHECK YOUR STACK", "var(--yellow)");
      break;
    }

    break;
  }

  game.combo = chain;
}

/* The currently fixed ring reference for overflow removal */
let fallingPieceReference = null;

/* =========================================================
   FIXED RING REFERENCE WRAPPER
========================================================= */

/*
   To identify the new ring accurately, retain the piece reference
   before lane evaluation.
*/

const originalFixFallingPiece = fixFallingPiece;

/* =========================================================
   STAR
========================================================= */

async function resolveStar(col) {
  const pieces = getLanePieces(col);
  const count = pieces.length - 1; // ★ itself is excluded

  soundStar();

  setStatus("STAR CLEAR!", "var(--yellow)");
  showEffect("★ STAR CLEAR ★", "clear", 1000);

  const xpCount = Math.max(1, count);

  for (let i = 0; i < xpCount; i++) {
    gainXP(1000, 0);
  }

  for (const item of pieces) {
    game.board[item.row][col] = null;
  }

  renderAll();
  await wait(500);
}

/* =========================================================
   EXPERIENCE / LEVEL
========================================================= */

function gainXP(base, chain = 0) {
  const multiplier = game.fever ? 4 : 1;
  const value = base * multiplier;

  game.totalXP += value;
  game.stageXP += value;

  renderHUD();
}

async function processLevelUp() {
  if (game.level >= 5) return false;

  const target = STAGE_TARGETS[game.level - 1];

  if (game.stageXP < target) return false;

  game.busy = true;

  clearInterval(game.dropTimer);
  game.dropTimer = null;

  game.level++;
  game.stageXP = 0;
  game.time = START_TIME;

  renderHUD();

  showEffect("LEVEL " + game.level, "level", 2200);
  setStatus("LEVEL UP!", "var(--yellow)");

  soundLevelUp();

  stopBGM();

  await wait(2200);

  if (!game.active) return true;

  if (game.audioEnabled) {
    playBGM(getBGMPath(game.level));
  }

  game.busy = false;

  // A new ring is created exactly once here.
  spawnRing();
  startDropTimer();

  renderAll();

  return true;
}

/* =========================================================
   ORB REFILL / FEVER
========================================================= */

function countOrbs() {
  let count = 0;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (game.board[r][c] &&
          game.board[r][c].type === "orb") {
        count++;
      }
    }
  }

  return count;
}

function isBoardEmpty() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (game.board[r][c]) return false;
    }
  }

  return true;
}

async function checkOrbRefillAndFever() {
  if (countOrbs() > 0) return;

  if (isBoardEmpty()) {
    await activateFever();
    return;
  }

  // Only completely empty lanes receive new orbs.
  for (let c = 0; c < COLS; c++) {
    let laneEmpty = true;

    for (let r = 0; r < ROWS; r++) {
      if (game.board[r][c]) {
        laneEmpty = false;
        break;
      }
    }

    if (laneEmpty) {
      game.board[ROWS - 1][c] = createOrb();
    }
  }

  renderAll();
}

async function activateFever() {
  if (game.fever) return;

  game.fever = true;
  game.feverTime = FEVER_TIME;

  showEffect("FEVER!", "fever", 1600);
  setStatus("FEVER ×4", "#ff78e8");

  soundFever();

  // Entire board is empty before FEVER orb setup.
  await wait(1200);

  for (let c = 0; c < COLS; c++) {
    game.board[ROWS - 1][c] = createOrb();
  }

  renderAll();

  clearInterval(game.feverTimer);

  game.feverTimer = setInterval(() => {
    if (!game.fever) return;

    game.feverTime -= .1;

    if (game.feverTime <= 0) {
      game.fever = false;
      game.feverTime = 0;
      clearInterval(game.feverTimer);
      setStatus("DROP RING");
    }
  }, 100);

  await wait(250);
}

/* =========================================================
   CLOCK
========================================================= */

function startClock() {
  clearInterval(game.clockTimer);

  game.clockTimer = setInterval(() => {
    if (!game.active || game.paused || game.busy) return;

    game.time--;

    renderHUD();

    if (game.time <= 0) {
      gameOver();
    }
  }, 1000);
}

/* =========================================================
   PAUSE / RETRY / MENU
========================================================= */

function pauseGame() {
  if (!game.active || game.busy || game.paused) return;

  game.paused = true;

  clearInterval(game.dropTimer);
  game.dropTimer = null;

  stopBGM();

  showOverlay(
    "PAUSE",
    "ゲームを中断しています。",
    [
      {
        label: "▶ つづける",
        action: resumeGame
      },
      {
        label: "🔄 リトライ",
        action: retryGame
      },
      {
        label: "🏠 メニューへ戻る",
        action: returnMenu
      }
    ]
  );
}

function resumeGame() {
  hideOverlay();

  game.paused = false;

  if (game.audioEnabled) playBGM();

  if (game.falling) {
    startDropTimer();
  } else {
    spawnRing();
    startDropTimer();
  }

  renderAll();
}

function retryGame() {
  hideOverlay();
  startGame();
}

function returnMenu() {
  game.session++;
  game.active = false;
  game.busy = false;
  game.paused = false;

  clearTimers();
  stopBGM();

  showScreen("titleScreen");
}

/* =========================================================
   GAME OVER / CLEAR
========================================================= */

function gameOver() {
  if (!game.active) return;

  game.active = false;
  game.busy = true;

  clearTimers();
  stopBGM();

  setStatus("GAME OVER", "var(--pink)");

  playEndBGM("assets/audio/bgm/GAMEOVER.mp3");

  showOverlay(
    "GAME OVER",
    "TIME UP または OVER LIMIT\n\n" +
    "LEVEL " + game.level +
    "\nTOTAL XP " + game.totalXP.toLocaleString(),
    [
      {
        label: "🔄 リトライ",
        action: retryGame
      },
      {
        label: "🏠 メニューへ戻る",
        action: returnMenu
      }
    ]
  );
}

function gameClear() {
  game.active = false;
  game.busy = true;

  clearTimers();
  stopBGM();

  setStatus("STAR CLEAR!", "var(--yellow)");

  showEffect("GAME CLEAR!", "clear", 2500);

  playEndBGM("assets/audio/bgm/OvercameHardships.mp3");

  showOverlay(
    "GAME CLEAR!",
    "LEVEL 5 CLEAR!\n\nTOTAL XP " +
    game.totalXP.toLocaleString() +
    "\n\nおめでとう！",
    [
      {
        label: "🔄 もう一度プレイ",
        action: retryGame
      },
      {
        label: "🏠 メニューへ戻る",
        action: returnMenu
      }
    ]
  );
}

/* =========================================================
   VISIBILITY / SAFETY
========================================================= */

document.addEventListener("visibilitychange", () => {
  if (document.hidden &&
      game.active &&
      !game.paused &&
      !game.busy) {
    pauseGame();
  }
});

/* =========================================================
   INITIALIZATION
========================================================= */

game.board = newBoard();
game.nextRings = Array.from({ length: COLS }, () => generateRing());

renderNext();

/* =========================================================
   OVERFLOW FIX:
   Track the piece placed by the current fixing operation.
========================================================= */

const _fixPieceOriginal = fixFallingPiece;

fixFallingPiece = async function() {
  if (!game.falling || game.busy) return;

  fallingPieceReference = game.falling.piece;

  await _fixPieceOriginal();

  fallingPieceReference = null;
};

/* =========================================================
   LEVEL-UP HANDLING:
   After a clear, evaluate stage progression before spawning
   another ring. Keep the ring spawn flow single-owner.
========================================================= */

const _gainXPOriginal = gainXP;

gainXP = function(base, chain = 0) {
  _gainXPOriginal(base, chain);
};

/* =========================================================
   LEVEL TARGET CHECK PATCH:
   Integrate stage-level advancement into the resolution flow.
========================================================= */

const _checkRefillOriginal = checkOrbRefillAndFever;

checkOrbRefillAndFever = async function() {
  await _checkRefillOriginal();

  if (!game.active) return;

  if (game.level < 5 &&
      game.stageXP >= STAGE_TARGETS[game.level - 1]) {
    await processLevelUp();
  }

  if (game.level >= 5 &&
      game.stageXP >= STAGE_TARGETS[4]) {
    gameClear();
  }
};

/* =========================================================
   START
========================================================= */

/* =========================================================
   ZOOM / GESTURE BLOCK
   画面タップ・ダブルタップ・トリプルタップ・ピンチで
   ブラウザ側のズームや拡大を起こさない。
   ゲーム本体の pointerdown 操作は維持する。
========================================================= */

let lastTouchEnd = 0;

document.addEventListener(
  "touchstart",
  (event) => {
    /*
      2本以上の指によるピンチ開始を止める。
      1本指の通常タップは止めない。
    */
    if (event.touches.length > 1) {
      event.preventDefault();
    }
  },
  {
    passive: false,
    capture: true
  }
);

document.addEventListener(
  "touchmove",
  (event) => {
    /*
      ピンチズーム・2本指ジェスチャーを防止。
    */
    if (event.touches.length > 1) {
      event.preventDefault();
    }
  },
  {
    passive: false,
    capture: true
  }
);

document.addEventListener(
  "touchend",
  (event) => {
    const now = Date.now();
    const interval = now - lastTouchEnd;

    /*
      400ms以内の連続タップをダブルタップ、
      さらに続くタップをトリプルタップとして扱う。

      ブラウザのズームだけを止める。
      ゲームのレーン操作は pointerdown で処理しているため、
      タップ・再タップによるレーン移動／即落下は維持される。
    */
    if (interval > 0 && interval <= 400) {
      event.preventDefault();
    }

    lastTouchEnd = now;
  },
  {
    passive: false,
    capture: true
  }
);

document.addEventListener(
  "dblclick",
  (event) => {
    /*
      iPhone Safari、TikTokなどのアプリ内ブラウザ、
      Android Chromeのダブルクリック拡大を防止。
    */
    event.preventDefault();
  },
  {
    passive: false,
    capture: true
  }
);

document.addEventListener(
  "gesturestart",
  (event) => {
    event.preventDefault();
  },
  {
    passive: false,
    capture: true
  }
);

document.addEventListener(
  "gesturechange",
  (event) => {
    event.preventDefault();
  },
  {
    passive: false,
    capture: true
  }
);

document.addEventListener(
  "gestureend",
  (event) => {
    event.preventDefault();
  },
  {
    passive: false,
    capture: true
  }
);

document.addEventListener(
  "contextmenu",
  (event) => {
    /*
      長押し時のブラウザ標準メニューも止める。
      ゲーム画面での長押し選択・画像メニューを防止。
    */
    event.preventDefault();
  },
  {
    passive: false,
    capture: true
  }
);


renderAll();

</script>
